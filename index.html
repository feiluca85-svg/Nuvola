<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuvola</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#b70138">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", -apple-system, sans-serif; }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    h1 { font-weight: 200; font-size: 32px; text-transform: lowercase; margin-bottom: 5px; letter-spacing: -1px; }
    p { color: #888888; font-size: 15px; margin-bottom: 25px; max-width: 300px; line-height: 1.4; }
    
    .wp8-tile-preview {
      width: 140px;
      height: 140px;
      margin-bottom: 30px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
    }
    .wp8-tile-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #install-btn {
      background-color: #b70138;
      color: white;
      border: none;
      padding: 14px 35px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      display: none; 
      text-transform: uppercase;
    }
    #loading-state {
      display: none;
      font-weight: bold;
      color: #b70138;
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Mostriamo la vera icona statica -->
  <div class="wp8-tile-preview" id="tile-preview">
    <img src="icon-192.png?v=4" alt="Nuvola">
  </div>

  <h1 id="main-title">nuvola app</h1>
  <p id="main-desc">Attendi il caricamento...</p>

  <button id="install-btn">Installa l'App</button>
  <div id="loading-state">Apertura Nuvola...</div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=3').catch(() => {});
    }

    window.onload = () => {
      // 1. Siamo già dentro l'app installata?
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (isStandalone) {
        document.getElementById('main-desc').style.display = 'none';
        document.getElementById('install-btn').style.display = 'none';
        document.getElementById('loading-state').style.display = 'block';
        
        setTimeout(() => {
          window.location.replace("https://nuvola.madisoft.it/login");
        }, 300);
        return;
      }

      // 2. Siamo nel browser
      document.getElementById('main-desc').innerText = "Clicca il pulsante in basso per installare l'app.";
      
      let deferredPrompt;
      const installBtn = document.getElementById('install-btn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
      });

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installBtn.style.display = 'none';
            document.getElementById('main-desc').innerText = "App installata! Apri la tua schermata Home.";
          }
          deferredPrompt = null;
        }
      });
      
      // Fallback per chi non riceve l'evento
      setTimeout(() => {
        if (installBtn.style.display === 'none') {
           document.getElementById('main-desc').innerText = "Usa il menu del browser (3 puntini in alto a destra / Condividi) e scegli 'Aggiungi a schermata Home'.";
        }
      }, 2000);
    };
  </script>
</body>
</html>
